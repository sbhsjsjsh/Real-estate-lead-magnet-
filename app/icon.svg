<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="crestBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2226"/>
      <stop offset="100%" stop-color="#111315"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EDE3"/>
      <stop offset="100%" stop-color="#C8BFB0"/>
    </linearGradient>
  </defs>
  <!-- Matte architectural tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#crestBg)"/>
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#EAE4D7" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Emerald architectural apex diamond -->
  <polygon points="32,12 36.2,16.2 32,20.4 27.8,16.2" fill="#168A62"/>

